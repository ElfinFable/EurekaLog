
name: Build EurekaLog

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Download Dalamud API
        shell: pwsh
        run: |
          Invoke-WebRequest "https://goatcorp.github.io/dalamud-distrib/stg/latest.zip" -OutFile dalamud.zip
          Expand-Archive dalamud.zip -DestinationPath dalamud -Force
          New-Item -ItemType Directory -Path refs -Force | Out-Null
          $names = @(
            "Dalamud.dll",
            "InteropGenerator.Runtime.dll",
            "FFXIVClientStructs.dll",
            "Dalamud.Bindings.ImGui.dll"
          )
          foreach ($name in $names) {
            $file = Get-ChildItem dalamud -Recurse -File |
              Where-Object Name -EQ $name |
              Select-Object -First 1
            if (-not $file) { throw "Missing Dalamud dependency: $name" }
            Copy-Item $file.FullName "refs/$name"
          }

      - name: Build plugin
        run: dotnet build EurekaLog.csproj -c Release

      - name: Upload compiled plugin
        uses: actions/upload-artifact@v4
        with:
          name: EurekaLog-Build
          path: |
            bin/Release/**/EurekaLog.dll
            bin/Release/**/EurekaLog.json
          if-no-files-found: error
